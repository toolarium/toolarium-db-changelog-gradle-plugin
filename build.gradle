plugins {
    id 'java-gradle-plugin'
}

apply from: "https://raw.githubusercontent.com/toolarium/common-gradle-build/master/gradle/common.gradle"


/***************************************************************************************
 * Allow additional root-level files not in the common-gradle-build default whitelist
 ***************************************************************************************/
addCommonGradlePropertyList("allowedMainFiles", "$rootDirectory/CLAUDE.md")


/***************************************************************************************
 * Gradle plugin definition
 ***************************************************************************************/
gradlePlugin {
    plugins {
        dbChangelog {
            id = "com.github.toolarium.db-changelog"
            implementationClass = "com.github.toolarium.db.changelog.gradle.plugin.ToolariumDbChangelogPlugin"
        }
    }
}


/************************************************************************************************************************
 * Define project dependencies
 ************************************************************************************************************************/
dependencies {

    // logging
    implementation "org.slf4j:slf4j-api:${commonGradleSlf4jApiVersion}"
    testImplementation "ch.qos.logback:logback-classic:${commonGradleLogbackVersion}"

    // toolarium-db-changelog library
    implementation "com.github.toolarium:toolarium-db-changelog:0.8.0"
}


/************************************************************************************************************************
 * Suppress obsolete source/target warnings when compiling with a newer JDK
 ************************************************************************************************************************/
tasks.withType(JavaCompile) {
    options.compilerArgs << '-Xlint:-options'
}


/************************************************************************************************************************
 * POM metadata and signing/publishing fixes for java-gradle-plugin:
 * - The pluginMaven and plugin marker publications do not inherit POM metadata from common-gradle-build.
 * - The signing output of one publication is consumed by the other without an explicit dependency.
 ************************************************************************************************************************/
afterEvaluate {
    publishing {
        publications {
            all {
                pom {
                    name = "${rootProject.name}"
                    description = "${projectDescription}"
                    url = "${projectUrl}"

                    licenses {
                        license {
                            name = "${licenseText}"
                            url = "${licenseUrl}"
                        }
                    }

                    def publishingUsername = project.getProperty('publishingUsername')
                    def publishingMail = publishingUsername
                    if (project.hasProperty('publishingMail')) {
                        publishingMail = project.getProperty('publishingMail')
                    }

                    developers {
                        developer {
                            id = "${mavenUsername}"

                            if (publishingUsername != null && !publishingUsername.isEmpty()) {
                                name = "${publishingUsername}"
                            }

                            if (publishingMail != null && !publishingMail.isEmpty()) {
                                email = "${publishingMail}"
                            }
                        }
                    }

                    def scmConnection
                    if (project.hasProperty('scmConnection')) {
                        scmConnection = project.getProperty('scmConnection')
                    } else {
                        def urlList = getRemoteGit()
                        if (urlList != null && !urlList.isEmpty() && urlList[0] != null && urlList[0].url != null) {
                            scmConnection = 'scm:git:' + urlList[0].url
                        }
                    }

                    def scmDeveloperConnection = scmConnection
                    if (project.hasProperty('scmDeveloperConnection')) {
                        scmDeveloperConnection = project.getProperty('scmDeveloperConnection')
                    }

                    if (scmConnection != null || scmDeveloperConnection != null) {
                        scm {
                            connection = "${scmConnection}"
                            developerConnection = "${scmDeveloperConnection}"
                            url = "${projectUrl}"
                        }
                    }
                }
            }
        }
    }

    tasks.matching { it.name == 'publishMavenJavaPublicationToMavenRepository' }.configureEach {
        def signTask = tasks.findByName('signPluginMavenPublication')
        if (signTask != null) {
            mustRunAfter signTask
        }
    }
    tasks.matching { it.name == 'publishPluginMavenPublicationToMavenRepository' }.configureEach {
        def signTask = tasks.findByName('signMavenJavaPublication')
        if (signTask != null) {
            mustRunAfter signTask
        }
    }
}
