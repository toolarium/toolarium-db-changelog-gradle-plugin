plugins {
    id 'java-gradle-plugin'
}

apply from: "https://raw.githubusercontent.com/toolarium/common-gradle-build/master/gradle/common.gradle"


/***************************************************************************************
 * Gradle plugin definition
 ***************************************************************************************/
gradlePlugin {
    plugins {
        dbChangelog {
            id = "com.github.toolarium.db-changelog"
            implementationClass = "com.github.toolarium.db.changelog.gradle.plugin.ToolariumDbChangelogPlugin"
        }
    }
}


/************************************************************************************************************************
 * Define project dependencies
 ************************************************************************************************************************/
dependencies {

    // logging
    implementation "org.slf4j:slf4j-api:${commonGradleSlf4jApiVersion}"
    testImplementation "ch.qos.logback:logback-classic:${commonGradleLogbackVersion}"

    // toolarium-db-changelog library
    implementation "com.github.toolarium:toolarium-db-changelog:0.8.0"
}


/************************************************************************************************************************
 * Suppress obsolete source/target warnings when compiling with a newer JDK
 ************************************************************************************************************************/
tasks.withType(JavaCompile) {
    options.compilerArgs << '-Xlint:-options'
}


/************************************************************************************************************************
 * Fix signing/publishing task dependency: java-gradle-plugin creates a pluginMaven publication whose signing output
 * is consumed by the mavenJava publication task without an explicit dependency.
 ************************************************************************************************************************/
afterEvaluate {
    tasks.matching { it.name == 'publishMavenJavaPublicationToMavenRepository' }.configureEach {
        def signTask = tasks.findByName('signPluginMavenPublication')
        if (signTask != null) {
            mustRunAfter signTask
        }
    }
    tasks.matching { it.name == 'publishPluginMavenPublicationToMavenRepository' }.configureEach {
        def signTask = tasks.findByName('signMavenJavaPublication')
        if (signTask != null) {
            mustRunAfter signTask
        }
    }
}
